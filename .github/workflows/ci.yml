# CI (Section 22.3): content, api, web and e2e on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --project apps/api --frozen
      - name: Validate content
        run: uv run --project apps/api python scripts/validate_content.py
      - name: Check the content JSON layout
        run: uv run --project apps/api python scripts/format_content.py --check

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seecode
          POSTGRES_PASSWORD: seecode
          POSTGRES_DB: seecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seecode -d seecode_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://seecode:seecode@localhost:5432/seecode_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Also the content scripts and the test harness the browser runner shares.
      - run: uv run ruff check . ../../scripts ../web/public/py
      - run: uv run ruff format --check . ../../scripts ../web/public/py
      - run: uv run mypy app ../../scripts ../web/public/py/harness.py ../web/public/py/tracer.py
      - run: uv run pytest
      - name: Build the API image (deployability)
        working-directory: .
        run: docker build -f apps/api/Dockerfile -t seecode-api:ci .

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seecode
          POSTGRES_PASSWORD: seecode
          POSTGRES_DB: seecode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seecode -d seecode"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # API with dev sign-in against the service database; Playwright starts it.
      DATABASE_URL: postgresql+asyncpg://seecode:seecode@localhost:5432/seecode
      ENV: development
      AUTH_DEV_BYPASS: "true"
      CORS_ORIGINS: http://localhost:3000
      # Web build settings (inlined at build time).
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_AUTH_DEV_BYPASS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --project apps/api --frozen
      - name: Migrate the database
        working-directory: apps/api
        run: uv run alembic upgrade head
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright + axe
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
